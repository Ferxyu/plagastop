
name: Deploy Plagastop to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        env:
          DEPLOY_GH_PAGES: 'true'
        run: npm run build

      # Con basename '/plagastop/', React Router guarda las páginas prerenderizadas en
      # build/client/plagastop/. GitHub Pages ya sirve el sitio bajo /plagastop/, así que
      # esas páginas se mueven a la raíz del artefacto (los assets ya están en build/client/assets).
      - name: Move prerendered pages to the site root
        run: |
          if [ -d build/client/plagastop ]; then
            cp -a build/client/plagastop/. build/client/
            rm -rf build/client/plagastop
          fi

      - name: Verify build output
        run: |
          test -s build/client/index.html
          grep -qi "<html" build/client/index.html

      - name: Add SPA fallback and disable Jekyll
        run: |
          if [ -f build/client/__spa-fallback.html ]; then
            cp build/client/__spa-fallback.html build/client/404.html
          fi
          touch build/client/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
